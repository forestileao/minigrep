version: v1.0
name: Rust
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2004
  containers:
    - name: main
      image: 'registry.semaphoreci.com/rust:1.47'
blocks:
  - name: Test
    task:
      jobs:
        - name: cargo test
          commands:
            - checkout
            - cargo build --verbose
            - cargo test --verbose
  - name: 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - echo "pastel"
        - name: 'Job #2'
          commands:
            - echo "outro job paralelo"
            - touch pastel2
            - echo "abelha" >> pastel2
after_pipeline:
  task:
    jobs:
      - name: 'Job #1'
        commands:
          - echo "terminamo"
promotions:
  - name: deployar pra prod
    pipeline_file: pipeline_2.yml
